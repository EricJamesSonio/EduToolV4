services:
  backend:
    build: ./backend
    container_name: edutool_backend
    ports:
      - "3001:3000"
    env_file:
      - ./backend/.env
    environment:
      # Force override (optional but safe)
      DATABASE_URL: ${DATABASE_URL}

  frontend:
    build: ./frontend
    container_name: edutool_frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_SOCKET_URL: http://localhost:3001
      NEXT_PUBLIC_WS_URL: ws://localhost:3001