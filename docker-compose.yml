services:
  backend:
    build: ./backend
    container_name: edutool_backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000
        NEXT_PUBLIC_SOCKET_URL: http://localhost:5000
        NEXT_PUBLIC_WS_URL: ws://localhost:5000
        NEXT_PUBLIC_AGORA_APP_ID: 054c5b501b5b4a39a9abf80c9e7af980
    container_name: edutool_frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"